[package]
name = "caribe-trips-mobile"
version = "0.1.0"
edition = "2021"
description = "Caribe Trips Android shell (Tauri 2)"
license = "MIT"

# Tauri mobile builds the app as a shared lib (cdylib) for Android and a
# staticlib/rlib for the desktop entry; kept OUT of workspace default-members so
# a plain `cargo build` never needs the desktop webview system libs.
[lib]
name = "caribe_trips_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
