# Caribe Trips — full local stack.
# `docker compose up --build` brings up MongoDB + the API + the web app.
# `docker compose up -d mongo` runs only MongoDB (for host-side API/web dev).
# `docker compose --profile tools up -d` adds mongo-express (admin UI).
#
# Ports are overridable via a .env file (MONGO_PORT / API_PORT / WEB_PORT) when
# the defaults clash with something already running locally.
services:
  mongo:
    image: mongo:7
    container_name: caribe-mongo
    restart: unless-stopped
    ports:
      # Host port is overridable to avoid clashing with a local Mongo install:
      # set MONGO_PORT in .env (then point MONGODB_URI at the same port).
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: crates/caribe-api/Dockerfile
    container_name: caribe-api
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: caribe_trips
      API_BIND: 0.0.0.0:8080
      # The browser origin that must be allowed by CORS (the web service below).
      WEB_ORIGIN: "http://localhost:${WEB_PORT:-5173}"
      # FQDN, not the short name: the container's resolver has no tailnet
      # search domain, so `gauss` alone does not resolve.
      OLLAMA_URL: "${OLLAMA_URL:-http://gauss.icefish-vector.ts.net:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma4:31b}"
      OLLAMA_TIMEOUT_MS: "${OLLAMA_TIMEOUT_MS:-60000}"
      CONCIERGE_ENABLED: "${CONCIERGE_ENABLED:-true}"
      RUST_LOG: info
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        # Baked into the bundle: the API URL the browser uses (host-published).
        VITE_API_BASE_URL: "http://localhost:${API_PORT:-8080}/api"
    container_name: caribe-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

  mongo-express:
    image: mongo-express:1.0.2
    container_name: caribe-mongo-express
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

  # ── Observability (profile: observability) ─────────────────────────────
  # `docker compose --profile observability up -d`. Nothing here is started by
  # a plain `docker compose up`, and none of it is a dependency of the app —
  # the API keeps running and logging to stdout whether this stack is up or not.
  #
  # Security is disabled on purpose: this is a local, private compose network,
  # so there are no credentials to store here.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: caribe-elasticsearch
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      # Cap the heap: the default grabs a share of host RAM this doesn't need.
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: caribe-kibana
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: caribe-filebeat
    restart: unless-stopped
    profiles: ["observability"]
    user: root
    # `--strict.perms=false`: the mounted config is owned by the host user, and
    # Filebeat otherwise refuses to start on the ownership mismatch.
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./observability/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Reads the API's stdout from the outside, so the api service itself
      # needs no logging driver, sidecar or config change.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  mongo_data: {}
  es_data: {}
  filebeat_data: {}
